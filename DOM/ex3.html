<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>
<body>
<h1>exercicio 3</h1>
<button onclick="voltarpagina()">voltar</button>
<button onclick="mostrarLocalização()">mostrar localização</button>
<button onclick="fecharPagina()">fechar a pagina</button>
    
</body>
<script>
    function voltarpagina(){
        window.history.back()
    }

    function mostrarLocalização(){
        alert("Sua pagina esta localizada; " + window.location)
    }
    function fecharPagina(){
        window.close()
    }
</script>
</html>
